<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181512"/>
      <stop offset="50%" stop-color="#241e17"/>
      <stop offset="100%" stop-color="#0e1014"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="300" fill="url(#bg)"/>

  <!-- Tactical Grid Lines & Grunge Details -->
  <path d="M0 50 H600 M0 150 H600 M0 250 H600" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <path d="M150 0 V300 M300 0 V300 M450 0 V300" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>

  <!-- Military Chevron Patterns -->
  <path d="M480 30 L530 80 L580 30" fill="none" stroke="#fbbf24" stroke-opacity="0.15" stroke-width="6"/>
  <path d="M480 60 L530 110 L580 60" fill="none" stroke="#fbbf24" stroke-opacity="0.1" stroke-width="6"/>

  <!-- Level 3 Helmet Icon Art (Right Side) -->
  <g transform="translate(430, 90)">
    <!-- Helmet Dome -->
    <path d="M20 70 C20 20, 110 20, 110 70 L115 110 L15 110 Z" fill="url(#metal)" stroke="#1e293b" stroke-width="3"/>
    <!-- Visor Guard -->
    <rect x="25" y="60" width="80" height="24" rx="4" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/>
    <rect x="35" y="68" width="60" height="8" rx="2" fill="#38bdf8" opacity="0.8"/>
    <!-- Air vents -->
    <circle cx="45" cy="95" r="3" fill="#0f172a"/>
    <circle cx="65" cy="95" r="3" fill="#0f172a"/>
    <circle cx="85" cy="95" r="3" fill="#0f172a"/>
  </g>

  <!-- Left Content Info -->
  <!-- Official Publisher Tag -->
  <rect x="36" y="36" width="160" height="22" rx="3" fill="#000000" fill-opacity="0.6" stroke="#fbbf24" stroke-opacity="0.4" stroke-width="1"/>
  <text x="44" y="51" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="900" letter-spacing="1.5">KRAFTON / TENCENT</text>

  <!-- Main Game Logo Text -->
  <text x="36" y="115" fill="#ffffff" font-family="'Impact', 'Arial Black', sans-serif" font-size="44" font-weight="900" letter-spacing="2">PUBG</text>
  <text x="175" y="115" fill="#fbbf24" font-family="'Impact', 'Arial Black', sans-serif" font-size="44" font-weight="900" letter-spacing="2">MOBILE</text>
  
  <text x="38" y="145" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1">UNKNOWN'S BATTLEGROUNDS</text>

  <!-- Golden UC Currency Tag -->
  <g transform="translate(36, 175)">
    <rect width="180" height="40" rx="4" fill="#000000" fill-opacity="0.7" stroke="#fbbf24" stroke-width="1.5"/>
    <circle cx="24" cy="20" r="12" fill="url(#gold)"/>
    <text x="18" y="25" fill="#000" font-family="sans-serif" font-size="12" font-weight="900">UC</text>
    <text x="46" y="25" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800">UNKNOWN CASH</text>
  </g>

  <!-- Bottom Specs -->
  <text x="38" y="260" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Global Server • 3 Saniyəyə Avtomatik ID Yükləməsi</text>
</svg>
