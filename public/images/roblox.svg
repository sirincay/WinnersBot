<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320">
  <defs>
    <linearGradient id="rbxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d14"/>
      <stop offset="50%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#08090e"/>
    </linearGradient>
    <linearGradient id="rbxRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <filter id="rbxGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="600" height="320" fill="url(#rbxBg)"/>

  <!-- Roblox 3D Tilted Square Icon (Reference: CrystalPNG) -->
  <g transform="translate(60, 50)" filter="url(#rbxGlow)">
    <g transform="rotate(15, 60, 60)">
      <rect width="115" height="115" rx="22" fill="url(#rbxRed)" stroke="#ffffff" stroke-width="2"/>
      <rect x="38" y="38" width="39" height="39" rx="8" fill="#0b0d14"/>
    </g>
  </g>

  <!-- Typography & Details (Right Side) -->
  <g transform="translate(220, 50)">
    <rect width="160" height="22" rx="4" fill="#000000" fill-opacity="0.6" stroke="#ef4444" stroke-width="1"/>
    <text x="12" y="15" fill="#ef4444" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="900" letter-spacing="1.5">ROBLOX CORP</text>

    <!-- Official ROBLOX text with tilted O -->
    <g transform="translate(0, 32)">
      <text x="0" y="36" fill="#ffffff" font-family="'Impact', 'Arial Black', sans-serif" font-size="42" font-weight="900" letter-spacing="2">R</text>
      <g transform="translate(32, 4) rotate(15, 16, 16)">
        <rect width="30" height="30" rx="5" fill="#ffffff"/>
        <rect x="10" y="10" width="10" height="10" rx="2" fill="#0b0d14"/>
      </g>
      <text x="70" y="36" fill="#ffffff" font-family="'Impact', 'Arial Black', sans-serif" font-size="42" font-weight="900" letter-spacing="2">BLOX</text>
    </g>

    <text x="2" y="95" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" letter-spacing="1">ROBUX DIGITAL GIFT CARD</text>

    <g transform="translate(0, 115)">
      <rect width="210" height="34" rx="6" fill="#000000" fill-opacity="0.75" stroke="#10b981" stroke-width="1.5"/>
      <polygon points="22,8 31,13 31,23 22,28 13,23 13,13" fill="#10b981"/>
      <circle cx="22" cy="18" r="3" fill="#000000"/>
      <text x="40" y="22" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800">ROBUX PIN KODU</text>
    </g>
  </g>

  <line x1="40" y1="260" x2="560" y2="260" stroke="#ef4444" stroke-opacity="0.2" stroke-width="1"/>
  <text x="40" y="285" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Global Aktivasiya Kodu • iOS, Android, PC və Konsol üçün</text>
</svg>
