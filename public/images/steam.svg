<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320">
  <defs>
    <linearGradient id="steamCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171d25"/>
      <stop offset="50%" stop-color="#1b2838"/>
      <stop offset="100%" stop-color="#0e141b"/>
    </linearGradient>
    <linearGradient id="steamBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#66c0f4"/>
      <stop offset="50%" stop-color="#2a475e"/>
      <stop offset="100%" stop-color="#1b2838"/>
    </linearGradient>
    <filter id="steamGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="600" height="320" fill="url(#steamCardBg)"/>

  <!-- Official Steam Piston Logo Emblem (Reference: LootBar) -->
  <g transform="translate(60, 45)" filter="url(#steamGlow)">
    <rect width="130" height="130" rx="24" fill="#1b2838" stroke="#66c0f4" stroke-width="2"/>
    <g transform="translate(25, 25)">
      <circle cx="50" cy="30" r="18" fill="none" stroke="#66c0f4" stroke-width="6"/>
      <circle cx="22" cy="55" r="10" fill="none" stroke="#66c0f4" stroke-width="5"/>
      <line x1="50" y1="30" x2="22" y2="55" stroke="#66c0f4" stroke-width="8" stroke-linecap="round"/>
      <circle cx="50" cy="30" r="8" fill="#66c0f4"/>
    </g>
  </g>

  <!-- Typography & Details (Right Side) -->
  <g transform="translate(220, 50)">
    <rect width="160" height="22" rx="4" fill="#000000" fill-opacity="0.6" stroke="#66c0f4" stroke-width="1"/>
    <text x="12" y="15" fill="#66c0f4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="900" letter-spacing="1.5">VALVE CORPORATION</text>

    <text x="0" y="65" fill="#ffffff" font-family="'Impact', 'Arial Black', sans-serif" font-size="38" font-weight="900" letter-spacing="3">STEAM</text>
    <text x="135" y="65" fill="#66c0f4" font-family="'Impact', 'Arial Black', sans-serif" font-size="38" font-weight="900" letter-spacing="2">WALLET</text>

    <text x="2" y="95" fill="#c7d5e0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" letter-spacing="1">GLOBAL USD &amp; EUROPE GIFT CARD</text>

    <g transform="translate(0, 115)">
      <rect width="210" height="34" rx="6" fill="#000000" fill-opacity="0.75" stroke="#66c0f4" stroke-width="1.5"/>
      <text x="16" y="22" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800">🕹️ RƏQƏMSAL HƏDİYYƏ KARTI</text>
    </g>
  </g>

  <line x1="40" y1="260" x2="560" y2="260" stroke="#66c0f4" stroke-opacity="0.2" stroke-width="1"/>
  <text x="40" y="285" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Avtomatlaşdırılmış PIN Kod • CS2, Dota 2 və Bütün Steam Oyunları</text>
</svg>
