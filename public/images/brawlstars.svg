<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320">
  <defs>
    <linearGradient id="bsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14061a"/>
      <stop offset="50%" stop-color="#240c30"/>
      <stop offset="100%" stop-color="#0e0412"/>
    </linearGradient>
    <linearGradient id="bsYellow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="bsGem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <filter id="bsGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="600" height="320" fill="url(#bsBg)"/>

  <!-- Official Brawl Stars Winged Skull Star Emblem (Reference: Vecteezy 27127558) -->
  <g transform="translate(60, 45)" filter="url(#bsGlow)">
    <path d="M65 10 L80 45 L120 48 L90 75 L100 115 L65 95 L30 115 L40 75 L10 48 L50 45 Z" fill="url(#bsYellow)" stroke="#000000" stroke-width="4"/>
    <g transform="translate(42, 35)">
      <path d="M23 0 C10 0 0 10 0 23 C0 32 6 38 12 42 L12 48 L34 48 L34 42 C40 38 46 32 46 23 C46 10 36 0 23 0 Z" fill="#ffffff" stroke="#000000" stroke-width="3"/>
      <ellipse cx="14" cy="20" rx="5" ry="7" fill="#0284c7" stroke="#000000" stroke-width="2"/>
      <ellipse cx="32" cy="20" rx="5" ry="7" fill="#0284c7" stroke="#000000" stroke-width="2"/>
      <line x1="23" y1="36" x2="23" y2="44" stroke="#000000" stroke-width="2"/>
    </g>
  </g>

  <!-- Typography & Details (Right Side) -->
  <g transform="translate(220, 50)">
    <rect width="110" height="22" rx="4" fill="#000000" fill-opacity="0.6" stroke="#fde047" stroke-width="1"/>
    <text x="12" y="15" fill="#fde047" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="900" letter-spacing="1.5">SUPERCELL</text>

    <text x="0" y="65" fill="#ffffff" font-family="'Impact', 'Arial Black', sans-serif" font-size="40" font-weight="900" letter-spacing="2">BRAWL</text>
    <text x="145" y="65" fill="url(#bsYellow)" font-family="'Impact', 'Arial Black', sans-serif" font-size="40" font-weight="900" letter-spacing="2">STARS</text>

    <text x="2" y="95" fill="#fef08a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" letter-spacing="1">GEMS &amp; BRAWL PASS TOP-UP</text>

    <g transform="translate(0, 115)">
      <rect width="210" height="34" rx="6" fill="#000000" fill-opacity="0.75" stroke="#22c55e" stroke-width="1.5"/>
      <polygon points="22,8 31,14 28,26 16,26 13,14" fill="url(#bsGem)"/>
      <text x="40" y="22" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800">BRAWL GEMS (ZÜMRÜD)</text>
    </g>
  </g>

  <line x1="40" y1="260" x2="560" y2="260" stroke="#fde047" stroke-opacity="0.2" stroke-width="1"/>
  <text x="40" y="285" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Supercell ID &amp; Player Tag ilə 3 Saniyəyə Avtomatik Təhvil</text>
</svg>
