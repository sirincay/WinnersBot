<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320">
  <defs>
    <linearGradient id="mlBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1c"/>
      <stop offset="50%" stop-color="#111d38"/>
      <stop offset="100%" stop-color="#060912"/>
    </linearGradient>
    <linearGradient id="mlGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <linearGradient id="mlCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="mlGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="600" height="320" fill="url(#mlBg)"/>

  <!-- Official Winged Emblem (Reference: FreePNGLogos) -->
  <g transform="translate(60, 45)" filter="url(#mlGlow)">
    <polygon points="65,10 115,25 115,75 65,125 15,75 15,25" fill="none" stroke="url(#mlGold)" stroke-width="4"/>
    <polygon points="65,22 102,34 102,72 65,110 28,72 28,34" fill="#080e1c" stroke="#38bdf8" stroke-width="1.5"/>
    <polygon points="65,35 88,58 65,88 42,58" fill="url(#mlCyan)"/>
    <path d="M15 45 L0 30 L10 65 L20 70 Z" fill="url(#mlGold)"/>
    <path d="M115 45 L130 30 L120 65 L110 70 Z" fill="url(#mlGold)"/>
  </g>

  <!-- Typography & Details (Right Side) -->
  <g transform="translate(220, 45)">
    <rect width="100" height="22" rx="4" fill="#000000" fill-opacity="0.6" stroke="#eab308" stroke-width="1"/>
    <text x="12" y="15" fill="#eab308" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="900" letter-spacing="1.5">MOONTON</text>

    <text x="0" y="55" fill="#ffffff" font-family="'Impact', 'Arial Black', sans-serif" font-size="34" font-weight="900" letter-spacing="1.5">MOBILE LEGENDS</text>
    <text x="0" y="85" fill="url(#mlGold)" font-family="'Impact', 'Arial Black', sans-serif" font-size="24" font-weight="900" letter-spacing="3">BANG BANG</text>

    <text x="2" y="112" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" letter-spacing="1">DIAMONDS &amp; TWILIGHT PASS</text>

    <g transform="translate(0, 125)">
      <rect width="210" height="34" rx="6" fill="#000000" fill-opacity="0.75" stroke="#38bdf8" stroke-width="1.5"/>
      <polygon points="22,8 32,17 22,27 12,17" fill="#38bdf8"/>
      <text x="40" y="22" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800">MLBB ALMAZLARI</text>
    </g>
  </g>

  <line x1="40" y1="260" x2="560" y2="260" stroke="#eab308" stroke-opacity="0.2" stroke-width="1"/>
  <text x="40" y="285" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Global &amp; CIS Server • User ID &amp; Zone ID ilə 3 Saniyəyə Yükləmə</text>
</svg>
