<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Winners Shop — Admin Girişi</title>
  <link rel="icon" type="image/jpeg" href="/images/winnerslogo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(15, 23, 42, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-sub: #64748b;
      --input-bg: rgba(2, 6, 23, 0.65);
      --input-border: rgba(255, 255, 255, 0.12);
      --error-bg: rgba(239, 68, 68, 0.12);
      --error-border: rgba(239, 68, 68, 0.3);
      --error-text: #fca5a5;
      --success-bg: rgba(16, 185, 129, 0.12);
      --success-border: rgba(16, 185, 129, 0.3);
      --success-text: #6ee7b7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      min-height: 100dvh;
      background: radial-gradient(circle at 50% 15%, #172033 0%, #090d16 75%);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 370px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 32px 26px;
      box-shadow: 0 20px 45px -10px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.04) inset;
      text-align: center;
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .logo-box {
      width: 52px;
      height: 52px;
      margin: 0 auto 16px auto;
      border-radius: 14px;
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.3);
    }

    .logo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 6px;
      letter-spacing: -0.3px;
    }

    .subtitle {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.45;
      margin-bottom: 24px;
    }

    .alert {
      display: none;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 18px;
      text-align: left;
      line-height: 1.4;
    }

    .alert-error {
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      color: var(--error-text);
    }

    .alert-success {
      background: var(--success-bg);
      border: 1px solid var(--success-border);
      color: var(--success-text);
    }

    .form-group {
      text-align: left;
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 7px;
    }

    .input-box {
      position: relative;
      display: flex;
      align-items: center;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 12px;
      padding: 0 10px 0 12px;
      height: 44px;
      transition: all 0.2s ease;
    }

    .input-box:focus-within {
      border-color: var(--primary);
      background: rgba(2, 6, 23, 0.9);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
    }

    .input-icon {
      color: var(--text-sub);
      display: flex;
      align-items: center;
      margin-right: 8px;
    }

    .input-box:focus-within .input-icon {
      color: #60a5fa;
    }

    input[type="password"], input[type="text"] {
      flex: 1;
      background: transparent;
      border: none;
      color: #ffffff;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      outline: none;
      padding: 0;
    }

    input::placeholder {
      color: #475569;
      font-size: 13.5px;
    }

    .btn-eye {
      background: transparent;
      border: none;
      color: var(--text-sub);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      border-radius: 6px;
      transition: color 0.15s;
    }

    .btn-eye:hover {
      color: #cbd5e1;
    }

    .btn-submit {
      width: 100%;
      height: 44px;
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s ease;
      margin-top: 6px;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
    }

    .btn-submit:hover {
      background: var(--primary-hover);
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.35);
    }

    .btn-submit:active {
      transform: scale(0.99);
    }

    .btn-submit:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }

    .footer-links {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .back-link {
      font-size: 13px;
      color: var(--text-sub);
      text-decoration: none;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color 0.15s ease;
    }

    .back-link:hover {
      color: #cbd5e1;
    }

    .shake {
      animation: shake 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    @keyframes shake {
      10%, 90% { transform: translate3d(-2px, 0, 0); }
      20%, 80% { transform: translate3d(3px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
      40%, 60% { transform: translate3d(4px, 0, 0); }
    }

    @media (max-width: 400px) {
      .login-card {
        padding: 26px 20px;
        border-radius: 16px;
      }
      h1 {
        font-size: 19px;
      }
    }
  </style>
</head>
<body>

  <div class="login-card" id="loginCard">
    <!-- Logo -->
    <div class="logo-box">
      <img src="/images/winnerslogo.jpg" alt="Winners Shop" onerror="this.src='/images/winnerslogo.jpg'">
    </div>

    <h1>Admin Girişi</h1>
    <p class="subtitle">İdarəetmə panelinə daxil olmaq üçün şifrənizi daxil edin.</p>

    <!-- Xəta / Uğur Bildirişi -->
    <div id="alertBox" class="alert"></div>

    <!-- Giriş Forması -->
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="adminPass">Şifrə</label>
        <div class="input-box">
          <div class="input-icon">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </div>
          <input 
            type="password" 
            id="adminPass" 
            placeholder="Şifrəni daxil edin..." 
            autofocus 
            required 
            autocomplete="current-password"
          >
          <button 
            type="button" 
            class="btn-eye" 
            onclick="togglePassword()" 
            title="Şifrəni göstər/gizlə"
            tabindex="-1"
          >
            <svg id="eyeIcon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" id="btnSubmit" class="btn-submit">
        <span id="btnText">Daxil Ol</span>
      </button>
    </form>

    <div class="footer-links">
      <a href="/" class="back-link">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        Əsas səhifəyə qayıt
      </a>
    </div>
  </div>

  <script>
    function togglePassword() {
      const input = document.getElementById('adminPass');
      const eyeIcon = document.getElementById('eyeIcon');
      if (!input) return;

      if (input.type === 'password') {
        input.type = 'text';
        eyeIcon.innerHTML = `
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
          <line x1="1" y1="1" x2="23" y2="23"></line>
        `;
      } else {
        input.type = 'password';
        eyeIcon.innerHTML = `
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        `;
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const passInput = document.getElementById('adminPass');
      const btnSubmit = document.getElementById('btnSubmit');
      const btnText = document.getElementById('btnText');
      const alertBox = document.getElementById('alertBox');
      const card = document.getElementById('loginCard');
      const password = passInput.value.trim();

      if (!password) return;

      btnSubmit.disabled = true;
      btnText.innerText = 'Daxil olunur...';
      alertBox.style.display = 'none';

      try {
        const res = await fetch('/api/admin/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });
        const data = await res.json();

        if (data.ok && data.token) {
          document.cookie = 'admin_token=' + encodeURIComponent(data.token) + '; path=/; max-age=2592000; SameSite=Lax';
          localStorage.setItem('admin_token', data.token);
          localStorage.setItem('winners_admin_token', data.token);
          sessionStorage.setItem('admin_token', data.token);
          sessionStorage.setItem('winners_admin_token', data.token);

          alertBox.className = 'alert alert-success';
          alertBox.innerHTML = 'Giriş uğurludur, yönləndirilirsiniz...';
          alertBox.style.display = 'block';

          btnSubmit.style.background = '#059669';
          btnText.innerText = 'Uğurlu ✓';

          setTimeout(() => {
            window.location.href = '/admin.html';
          }, 300);
        } else {
          alertBox.className = 'alert alert-error';
          alertBox.innerHTML = data.error || 'Daxil edilmiş şifrə yanlışdır.';
          alertBox.style.display = 'block';

          if (card) {
            card.classList.add('shake');
            setTimeout(() => card.classList.remove('shake'), 400);
          }

          passInput.value = '';
          passInput.focus();
        }
      } catch (err) {
        alertBox.className = 'alert alert-error';
        alertBox.innerHTML = 'Şəbəkə xətası baş verdi. Zəhmət olmasa yenidən cəhd edin.';
        alertBox.style.display = 'block';
      } finally {
        btnSubmit.disabled = false;
        if (!alertBox.classList.contains('alert-success')) {
          btnText.innerText = 'Daxil Ol';
        }
      }
    }

    // Əgər aktiv sessiya varsa dərhal aç
    (async function checkExistingAuth() {
      const token = localStorage.getItem('admin_token') || localStorage.getItem('winners_admin_token');
      if (token) {
        try {
          const res = await fetch('/api/admin/auth/verify', {
            headers: { 'Authorization': 'Bearer ' + token }
          });
          const data = await res.json();
          if (data.ok) {
            document.cookie = 'admin_token=' + encodeURIComponent(token) + '; path=/; max-age=2592000; SameSite=Lax';
            window.location.href = '/admin.html';
          }
        } catch (e) {}
      }
    })();
  </script>
</body>
</html>
